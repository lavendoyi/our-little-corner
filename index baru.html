<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Little Corner</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff5f7;--card:#fff;--ink:#4a3340;--soft:#9a7b8a;--pink:#ff8fab;--pink2:#ffd6e0;--line:#f6d9e2}
@media(prefers-color-scheme:dark){:root{--bg:#2a1e26;--card:#3a2a34;--ink:#fbe9f0;--soft:#c9a5b6;--pink2:#5a3445;--line:#503844}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Quicksand',system-ui,sans-serif;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:calc(84px + env(safe-area-inset-top,0px)) 16px 40px}
h1{font-family:'Pacifico',cursive;font-weight:400;font-size:2rem;text-align:center;margin:8px 0 2px;color:var(--pink)}
.sub{text-align:center;color:var(--soft);margin:0 0 16px;font-size:.9rem}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 12px;outline:none}
input:focus,textarea:focus{border-color:var(--pink)}
textarea{resize:vertical;min-height:64px}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:10px 16px;background:var(--pink);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--soft);padding:4px 8px;font-size:.8rem}
.stack{display:flex;flex-direction:column;gap:8px}
.meta{font-size:.78rem;color:var(--soft);display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.msg{white-space:pre-wrap;word-break:break-word}
.moods{display:flex;gap:6px;flex-wrap:wrap}
.moods button{background:var(--bg);color:var(--ink);border:2px solid var(--line);padding:4px 10px;font-size:1.1rem}
.moods button.on{border-color:var(--pink);background:var(--pink2)}
.tabs{position:fixed;left:0;right:0;top:0;background:var(--card);border-bottom:2px solid var(--line);display:flex;justify-content:center;padding:calc(6px + env(safe-area-inset-top,0px)) 6px 6px;z-index:5}
.tabs button{flex:1;max-width:110px;background:transparent;color:var(--soft);padding:6px 2px;font-size:.7rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button span{font-size:1.3rem}
.tabs button.on{color:var(--pink)}
.pane{display:none}.pane.on{display:block}
.hide{display:none!important}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dow{font-size:.7rem;color:var(--soft)}
.cal .d{aspect-ratio:1;border-radius:12px;background:var(--bg);border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.85rem;padding:0;color:var(--ink);font-weight:600}
.cal .d.today{border-color:var(--pink)}
.cal .d.sel{background:var(--pink);color:#fff}
.cal .d i{font-style:normal;font-size:.6rem;line-height:1;color:var(--pink)}
.cal .d.sel i{color:#fff}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px;display:block}
.ph p{margin:4px 2px;font-size:.8rem}
a{color:var(--pink);font-weight:700;word-break:break-all}
.empty{text-align:center;color:var(--soft);padding:18px}
.note{font-size:.8rem;color:var(--soft);text-align:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--bg);color:var(--ink);border:2px solid var(--line);padding:4px 10px;font-size:.8rem;border-radius:999px;font-weight:600}
.chip.on{border-color:var(--pink);background:var(--pink2)}
.ghost.on{color:var(--pink)}
.star{background:none;color:var(--line);font-size:1.6rem;padding:0 4px}.star.on{color:var(--pink)}
.err{color:#d6336c;font-size:.8rem}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:12px;cursor:pointer}.thumbs img.big{width:100%;height:auto}
h3.mo{margin:14px 4px 8px;color:var(--soft);font-size:.9rem}
summary{cursor:pointer;font-weight:700;color:var(--soft)}
</style>
</head>
<body>
<div class="wrap">
  <h1>our little corner</h1>
  <p class="sub" id="sub">loading…</p>

  <section id="login" class="card stack hide">
    <input id="email" type="email" placeholder="email" autocomplete="username">
    <input id="pass" type="password" placeholder="password" autocomplete="current-password">
    <button id="loginBtn">come on in 💗</button>
    <div class="note" id="loginErr"></div>
  </section>

  <div id="app" class="hide">
  <section class="pane on" id="p-today">
    <div class="card stack">
      <div class="moods" id="moods"></div>
      <textarea id="postText" placeholder="what did you do today? ♡"></textarea>
      <button id="postBtn">send it 💌</button>
    </div>
    <div id="postList"></div>
  </section>

  <section class="pane" id="p-cal">
    <div class="card">
      <div class="calhead"><button class="ghost" id="prev">‹</button><span id="monthLbl"></span><button class="ghost" id="next">›</button></div>
      <div class="cal" id="cal"></div>
    </div>
    <div class="card stack">
      <b id="dayLbl"></b>
      <div id="dayList"></div>
      <div class="row"><input id="planText" placeholder="add a plan for this day…"><button id="planBtn">add</button></div>
    </div>
  </section>

  <section class="pane" id="p-music">
    <div class="card stack">
      <input id="songTitle" placeholder="song title / artist">
      <input id="songUrl" placeholder="link (Spotify, YouTube, Apple Music…)">
      <button id="songBtn">add to our playlist 🎶</button>
    </div>
    <div id="songList"></div>
  </section>

  <section class="pane" id="p-days">
    <div class="card stack">
      <input id="dSearch" type="search" placeholder="search our days…">
      <div class="row"><input id="dFrom" type="date" title="from"><input id="dTo" type="date" title="to"></div>
      <input id="dTag" placeholder="filter by tag">
      <div class="row"><button class="ghost" id="dView">📅 calendar</button><button class="ghost" id="dFavF">♡ favorites</button><button id="dNew">+ new day</button></div>
    </div>
    <div class="card stack hide" id="dForm">
      <input id="dTitle" placeholder="title (e.g. picnic at the park)">
      <input id="dDate" type="date">
      <input id="dLoc" placeholder="📍 location (optional)">
      <div class="note">how was the day? (optional)</div><div id="dStars" class="row" style="justify-content:center"></div>
      <div class="note">how did it feel?</div><div class="chips" id="dEmo"></div>
      <textarea id="dDesc" placeholder="what did we do today?"></textarea>
      <textarea id="dPart" placeholder="✨ our favorite part"></textarea>
      <textarea id="dNote" placeholder="💌 little note (optional)"></textarea>
      <input id="dTags" placeholder="tags, separated by commas (optional)">
      <div class="thumbs" id="dThumbs"></div>
      <input id="dFile" type="file" accept="image/*" multiple>
      <div class="err" id="dErr"></div>
      <div class="row"><button id="dSave">save 💗</button><button class="ghost" id="dCancel">cancel</button></div>
    </div>
    <div class="card hide" id="dCal"><div class="calhead"><button class="ghost" id="dPrev">‹</button><span id="dMonth"></span><button class="ghost" id="dNext">›</button></div><div class="cal" id="dGrid"></div></div>
    <div id="dayLog"></div>
    <details class="card"><summary>earlier photos</summary><div class="grid" id="photoList"></div></details>
  </section>

  <section class="pane" id="p-links">
    <div class="card stack">
      <input id="lSearch" type="search" placeholder="search title, link, notes, tags…">
      <div class="row"><select id="lSort"><option value="new">newest first</option><option value="az">A → Z</option></select><button class="ghost" id="lFavF">♡ favorites</button><button id="lNew">+ link</button></div>
      <div class="chips" id="lCats"></div>
      <div class="row"><button class="ghost" id="catAdd">+ category</button><button class="ghost hide" id="catRen">rename</button><button class="ghost hide" id="catDel">delete</button></div>
    </div>
    <div class="card stack hide" id="lForm">
      <input id="lTitle" placeholder="title">
      <input id="lUrl" placeholder="https://…" inputmode="url">
      <select id="lCat"></select>
      <input id="lTags" placeholder="tags, separated by commas (optional)">
      <textarea id="lNote" placeholder="notes (optional)"></textarea>
      <div class="err" id="lErr"></div>
      <div class="row"><button id="lSave">save 🔖</button><button class="ghost" id="lCancel">cancel</button></div>
    </div>
    <div id="linkList"></div>
    <p class="note"><button class="ghost" id="logout">log out</button></p>
  </section>
  </div>
</div>

<nav class="tabs hide" id="tabs">
  <button data-t="today" class="on"><span>💌</span>today</button>
  <button data-t="cal"><span>📅</span>plans</button>
  <button data-t="music"><span>🎶</span>playlist</button>
  <button data-t="days"><span>📖</span>our days</button>
  <button data-t="links"><span>🔖</span>links</button>
</nav>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,addDoc,deleteDoc,updateDoc,arrayUnion,arrayRemove,doc,query,orderBy,limit,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ====== PASTE YOUR FIREBASE CONFIG HERE (from Firebase console > Project settings > Your apps) ======
const firebaseConfig = {
apiKey: "AIzaSyDNBmNgaaLrk4dVMWb5of_mwsRQh0b4RTE",
  authDomain: "our-little-corner-8eb52.firebaseapp.com",
  projectId: "our-little-corner-8eb52",
  storageBucket: "our-little-corner-8eb52.firebasestorage.app",
  messagingSenderId: "571236774268",
  appId: "1:571236774268:web:9b6ca359b6501af01634f9"
 
};
// =================================================================================================

const fb=initializeApp(firebaseConfig),auth=getAuth(fb),fs=getFirestore(fb);
const $=id=>document.getElementById(id);
let me=null,nick=localStorage.getItem('nick')||'',unsubs=[];
const data={posts:[],plans:[],songs:[],photos:[],links:[],linkCategories:[],days:[],dayPhotos:[],emotions:[]};
let mood='🥰',selDate=ymd(new Date()),view=new Date();
const MOODS=['🥰','😊','😴','🥲','🤪','😤','🤒','🎉'];

function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function nm(d){return d.uid===me?'you':(d.name||'your love')}
function when(ts){try{return new Date(ts).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}catch(e){return ''}}
function safeUrl(u){try{const x=new URL(/^https?:\/\//i.test(u)?u:'https://'+u);return(x.protocol==='http:'||x.protocol==='https:')?x.href:null}catch(e){return null}}
async function del(coll,id){if(!confirm('Remove this?'))return;try{await deleteDoc(doc(fs,coll,id))}catch(e){alert('Couldn’t remove that one.')}}
function head(coll,d){const m=el('div','meta');m.append(el('span','',nm(d)+' · '+when(d.ts)));if(d.uid===me){const b=el('button','ghost','remove');b.onclick=()=>del(coll,d.id);m.append(b)}return m}

function renderPosts(){
  const box=$('postList');box.replaceChildren();
  if(!data.posts.length){box.append(el('div','empty','no messages yet — say hi! 💕'));return}
  data.posts.forEach(d=>{const c=el('div','card');c.append(head('posts',d));c.append(el('div','msg',(d.mood||'')+' '+d.text));box.append(c)});
}
function renderCal(){
  const y=view.getFullYear(),m=view.getMonth();
  $('monthLbl').textContent=view.toLocaleString([], {month:'long',year:'numeric'});
  const g=$('cal');g.replaceChildren();
  'SMTWTFS'.split('').forEach(x=>g.append(el('div','dow',x)));
  const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),today=ymd(new Date());
  for(let i=0;i<first;i++)g.append(el('div'));
  for(let n=1;n<=days;n++){
    const k=y+'-'+String(m+1).padStart(2,'0')+'-'+String(n).padStart(2,'0');
    const b=el('button','d'+(k===today?' today':'')+(k===selDate?' sel':''),String(n));
    if(data.plans.some(p=>p.date===k))b.append(el('i','','♥'));
    b.onclick=()=>{selDate=k;renderCal();renderDay()};
    g.append(b);
  }
}
function renderDay(){
  const [y,m,d]=selDate.split('-').map(Number);
  $('dayLbl').textContent='✨ '+new Date(y,m-1,d).toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'});
  const box=$('dayList');box.replaceChildren();
  const ps=data.plans.filter(p=>p.date===selDate);
  if(!ps.length){box.append(el('div','note','nothing planned yet'));return}
  ps.forEach(p=>{const r=el('div','card');r.append(head('plans',p));r.append(el('div','msg',p.text));box.append(r)});
}
function linkCard(coll,d,icon){
  const c=el('div','card');c.append(head(coll,d));
  const u=safeUrl(d.url||'');
  if(u){const a=el('a','',icon+' '+d.title);a.href=u;a.target='_blank';a.rel='noopener noreferrer';c.append(a)}else c.append(el('div','msg',icon+' '+d.title));
  if(d.note)c.append(el('div','msg',d.note));
  return c;
}
function renderSongs(){const b=$('songList');b.replaceChildren();if(!data.songs.length)b.append(el('div','empty','our playlist is empty 🎧'));data.songs.forEach(s=>b.append(linkCard('songs',s,'🎵')))}

function renderPhotos(){
  const box=$('photoList');box.replaceChildren();
  if(!data.photos.length){const e=el('div','empty','no photos yet 📷');e.style.gridColumn='1/-1';box.append(e);return}
  data.photos.forEach(p=>{const w=el('div','ph card');w.style.padding='8px';
    const im=el('img');im.src=p.img;im.alt=p.caption||'photo';w.append(im);
    if(p.caption)w.append(el('p','',p.caption));
    w.append(head('photos',p));box.append(w)});
}
const renderers={posts:renderPosts,plans:()=>{renderCal();renderDay()},songs:renderSongs,photos:renderPhotos,links:renderLinks};

// ================= shared helpers (links + days) =================
const loaded={};
const tagsOf=t=>[...new Set(t.split(/[,\s]+/).map(x=>x.replace(/^#/,'').toLowerCase().slice(0,24)).filter(Boolean))].slice(0,10);
const isFav=d=>(d.favs||[]).includes(me);
const toggleFav=(coll,d)=>updateDoc(doc(fs,coll,d.id),{favs:isFav(d)?arrayRemove(me):arrayUnion(me)}).catch(()=>alert('Couldn’t update favorite.'));
function state(box,coll){
  if(loaded[coll]==='err'){box.append(el('div','empty','couldn’t load this 🥺 — check your connection'));return true}
  if(!loaded[coll]){box.append(el('div','empty','loading…'));return true}
  return false}
function acts(coll,d,edit,rm){const r=el('div','row');r.style.justifyContent='flex-end';
  const f=el('button','ghost'+(isFav(d)?' on':''),isFav(d)?'♥ favorite':'♡ favorite');f.onclick=()=>toggleFav(coll,d);r.append(f);
  if(d.uid===me){const e=el('button','ghost','edit');e.onclick=()=>edit(d);const x=el('button','ghost','remove');x.onclick=rm||(()=>del(coll,d.id));r.append(e,x)}
  return r}

// ================= Links library =================
const L={q:'',cat:'all',fav:false,sort:'new',edit:null};
function renderLinks(){
  const cats=[...data.linkCategories].sort((a,b)=>a.ts-b.ts),cname=id=>(cats.find(c=>c.id===id)||{}).name;
  const bar=$('lCats');bar.replaceChildren();
  [['all','All'],...cats.map(c=>[c.id,c.name]),['none','Uncategorized']].forEach(([id,n])=>{const b=el('button','chip'+(L.cat===id?' on':''),n);b.onclick=()=>{L.cat=id;renderLinks()};bar.append(b)});
  const real=cats.some(c=>c.id===L.cat);$('catRen').classList.toggle('hide',!real);$('catDel').classList.toggle('hide',!real);
  const sel=$('lCat'),v=sel.value;sel.replaceChildren(new Option('Uncategorized',''),...cats.map(c=>new Option(c.name,c.id)));sel.value=v;
  $('lFavF').classList.toggle('on',L.fav);$('lFavF').textContent=L.fav?'♥ favorites':'♡ favorites';
  const box=$('linkList');box.replaceChildren();if(state(box,'links'))return;
  const q=L.q.toLowerCase();
  let a=data.links.filter(l=>(L.cat==='all'||(L.cat==='none'?!cname(l.catId):l.catId===L.cat))&&(!L.fav||isFav(l))&&(!q||[l.title,l.url,l.note,(l.tags||[]).join(' ')].join(' ').toLowerCase().includes(q)));
  if(L.sort==='az')a=[...a].sort((x,y)=>(x.title||'').localeCompare(y.title||''));
  if(!a.length){box.append(el('div','empty',data.links.length?'nothing matches 🔍':'no saved links yet 🔗'));return}
  a.forEach(l=>{const c=el('div','card stack'),u=safeUrl(l.url||'');
    if(u){const x=el('a','','🔖 '+(l.title||u));x.href=u;x.target='_blank';x.rel='noopener noreferrer';c.append(x)}else c.append(el('div','msg','🔖 '+(l.title||'')));
    c.append(el('div','note',[cname(l.catId)||'Uncategorized',...(l.tags||[]).map(t=>'#'+t)].join(' · ')));
    if(l.note)c.append(el('div','msg',l.note));
    const m=el('div','meta');m.append(el('span','','added by '+nm(l)+' · '+when(l.ts)));c.append(m,acts('links',l,openLink));box.append(c)});
}
function openLink(l){L.edit=l?l.id:null;$('lForm').classList.remove('hide');
  $('lTitle').value=l&&l.title||'';$('lUrl').value=l&&l.url||'';$('lNote').value=l&&l.note||'';$('lTags').value=l?(l.tags||[]).join(', '):'';$('lCat').value=l&&l.catId||'';$('lErr').textContent='';$('lTitle').focus()}
$('lNew').onclick=()=>openLink();$('lCancel').onclick=()=>$('lForm').classList.add('hide');
$('lSearch').oninput=e=>{L.q=e.target.value;renderLinks()};
$('lSort').onchange=e=>{L.sort=e.target.value;renderLinks()};
$('lFavF').onclick=()=>{L.fav=!L.fav;renderLinks()};
$('lSave').onclick=async()=>{
  const u=safeUrl($('lUrl').value.trim());if(!u){$('lErr').textContent='That doesn’t look like a valid link.';return}
  const f={title:$('lTitle').value.trim()||new URL(u).hostname,url:u,note:$('lNote').value.trim(),catId:$('lCat').value,tags:tagsOf($('lTags').value)};
  $('lSave').disabled=true;$('lErr').textContent='';
  try{if(L.edit)await updateDoc(doc(fs,'links',L.edit),{...f,updated:Date.now()});else if(!await add('links',f))throw 0;$('lForm').classList.add('hide')}
  catch(e){$('lErr').textContent='Couldn’t save — try again.'}
  $('lSave').disabled=false};
const curCat=()=>data.linkCategories.find(c=>c.id===L.cat);
$('catAdd').onclick=async()=>{const n=(prompt('New category name')||'').trim().slice(0,30);if(!n)return;
  if(data.linkCategories.some(c=>c.name.toLowerCase()===n.toLowerCase()))return alert('That category already exists.');await add('linkCategories',{name:n})};
$('catRen').onclick=async()=>{const c=curCat();if(!c)return;const n=(prompt('Rename category',c.name)||'').trim().slice(0,30);
  if(n&&n!==c.name)try{await updateDoc(doc(fs,'linkCategories',c.id),{name:n})}catch(e){alert('Couldn’t rename.')}};
$('catDel').onclick=async()=>{const c=curCat();if(!c||!confirm('Delete “'+c.name+'”? Its links are kept as Uncategorized.'))return;
  try{await deleteDoc(doc(fs,'linkCategories',c.id));L.cat='all'}catch(e){alert('Couldn’t delete.')}};

// ================= Our Days =================
const D={q:'',tag:'',from:'',to:'',fav:false,cal:false,day:'',edit:null,rate:0,emo:new Set(),rm:new Set(),m:new Date()};
const BASE_EMO=['😊 Happy','🥰 Loved','🤩 Excited','😌 Calm','🤪 Silly','😴 Tired','🥹 Grateful','🥲 Nostalgic'];
const fmtDay=t=>{const [y,m,d]=t.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString([], {weekday:'short',month:'short',day:'numeric',year:'numeric'})};
function renderForm(){
  const s=$('dStars');s.replaceChildren();
  for(let i=1;i<=5;i++){const b=el('button','star'+(i<=D.rate?' on':''),'★');b.onclick=()=>{D.rate=D.rate===i?0:i;renderForm()};s.append(b)}
  const e=$('dEmo');e.replaceChildren();
  [...BASE_EMO,...data.emotions.map(x=>x.name).filter(n=>!BASE_EMO.includes(n))].forEach(n=>{const b=el('button','chip'+(D.emo.has(n)?' on':''),n);b.onclick=()=>{D.emo.has(n)?D.emo.delete(n):D.emo.add(n);renderForm()};e.append(b)});
  const x=el('button','chip','+ custom');x.onclick=async()=>{const n=(prompt('Custom emotion (e.g. 🥳 Proud)')||'').trim().slice(0,24);if(!n)return;
    D.emo.add(n);if(!BASE_EMO.includes(n)&&!data.emotions.some(z=>z.name===n))await add('emotions',{name:n});renderForm()};e.append(x);
  const t=$('dThumbs');t.replaceChildren();
  (D.edit?data.dayPhotos.filter(p=>p.dayId===D.edit&&!D.rm.has(p.id)):[]).forEach(p=>{const i=el('img');i.src=p.img;i.title='tap to remove';i.onclick=()=>{D.rm.add(p.id);renderForm()};t.append(i)});
}
function openDay(d){D.edit=d?d.id:null;D.rate=d&&d.rating||0;D.emo=new Set(d&&d.emotions||[]);D.rm=new Set();
  const v={dTitle:d&&d.title,dDate:d?d.date:ymd(new Date()),dLoc:d&&d.location,dDesc:d&&d.desc,dPart:d&&d.part,dNote:d&&d.note,dTags:d?(d.tags||[]).join(', '):''};
  for(const k in v)$(k).value=v[k]||'';$('dFile').value='';$('dErr').textContent='';$('dForm').classList.remove('hide');renderForm();$('dTitle').focus()}
function renderDCal(){
  $('dCal').classList.toggle('hide',!D.cal);if(!D.cal)return;
  const y=D.m.getFullYear(),m=D.m.getMonth(),g=$('dGrid');g.replaceChildren();$('dMonth').textContent=D.m.toLocaleString([], {month:'long',year:'numeric'});
  'SMTWTFS'.split('').forEach(x=>g.append(el('div','dow',x)));
  for(let i=0;i<new Date(y,m,1).getDay();i++)g.append(el('div'));
  for(let n=1;n<=new Date(y,m+1,0).getDate();n++){const k=y+'-'+String(m+1).padStart(2,'0')+'-'+String(n).padStart(2,'0');
    const b=el('button','d'+(k===D.day?' sel':'')+(k===ymd(new Date())?' today':''),String(n));if(data.days.some(d=>d.date===k))b.append(el('i','','♥'));
    b.onclick=()=>{D.day=D.day===k?'':k;renderDays()};g.append(b)}
}
function renderDays(){
  const box=$('dayLog');box.replaceChildren();renderDCal();
  $('dFavF').classList.toggle('on',D.fav);$('dFavF').textContent=D.fav?'♥ favorites':'♡ favorites';
  if(state(box,'days'))return;
  const q=D.q.toLowerCase(),tg=D.tag.toLowerCase().replace('#','').trim();
  const a=data.days.filter(d=>d.date&&(!D.fav||isFav(d))&&(!D.from||d.date>=D.from)&&(!D.to||d.date<=D.to)&&(!D.day||d.date===D.day)&&(!tg||(d.tags||[]).some(t=>t.includes(tg)))&&(!q||[d.title,d.location,d.desc,d.part,d.note,(d.tags||[]).join(' '),(d.emotions||[]).join(' ')].join(' ').toLowerCase().includes(q))).sort((x,y)=>y.date.localeCompare(x.date)||y.ts-x.ts);
  if(!a.length){box.append(el('div','empty',data.days.length?'no days match 🔍':'no days yet — add your first one 📖'));return}
  let mo='';
  a.forEach(d=>{const m=d.date.slice(0,7);if(m!==mo){mo=m;const [y,n]=m.split('-').map(Number);box.append(el('h3','mo',new Date(y,n-1,1).toLocaleString([], {month:'long',year:'numeric'})))}
    const c=el('div','card stack');c.append(el('b','',d.title||fmtDay(d.date)));
    c.append(el('div','note',fmtDay(d.date)+(d.location?' · 📍 '+d.location:'')+(d.rating?' · '+'★'.repeat(d.rating)+'☆'.repeat(5-d.rating):'')));
    if((d.emotions||[]).length){const e=el('div','chips');d.emotions.forEach(x=>e.append(el('span','chip',x)));c.append(e)}
    if(d.desc)c.append(el('div','msg',d.desc));
    if(d.part)c.append(el('div','msg','✨ favorite part: '+d.part));
    if(d.note)c.append(el('div','msg','💌 '+d.note));
    if((d.tags||[]).length)c.append(el('div','note',d.tags.map(t=>'#'+t).join(' ')));
    const ph=data.dayPhotos.filter(p=>p.dayId===d.id);
    if(ph.length){const t=el('div','thumbs');ph.forEach(p=>{const i=el('img');i.src=p.img;i.alt='';i.onclick=()=>i.classList.toggle('big');t.append(i)});c.append(t)}
    const edited=d.updated&&d.updated>d.ts+1000?' · edited '+when(d.updated)+(d.updatedBy&&d.updatedBy!==d.uid?' by '+(d.updatedBy===me?'you':d.updatedName||'your love'):''):'';
    const mt=el('div','meta');mt.append(el('span','','added by '+nm(d)+' · '+when(d.ts)+edited));c.append(mt,acts('days',d,openDay,()=>delDay(d)));box.append(c)});
}
async function delDay(d){if(!confirm('Delete this day and its photos?'))return;
  try{for(const p of data.dayPhotos.filter(p=>p.dayId===d.id))await deleteDoc(doc(fs,'dayPhotos',p.id));await deleteDoc(doc(fs,'days',d.id))}catch(e){alert('Couldn’t delete everything.')}}
$('dSave').onclick=async()=>{
  const date=$('dDate').value;if(!date){$('dErr').textContent='Pick a date.';return}
  const f={title:$('dTitle').value.trim(),date,location:$('dLoc').value.trim(),rating:D.rate,emotions:[...D.emo],desc:$('dDesc').value.trim(),part:$('dPart').value.trim(),note:$('dNote').value.trim(),tags:tagsOf($('dTags').value)};
  const files=[...$('dFile').files].slice(0,8),meta={updated:Date.now(),updatedBy:me,updatedName:nick};
  $('dSave').disabled=true;$('dErr').textContent='saving…';
  try{let id=D.edit;
    if(id){await updateDoc(doc(fs,'days',id),{...f,...meta});for(const p of D.rm)await deleteDoc(doc(fs,'dayPhotos',p))}
    else{const r=await add('days',{...f,...meta});if(!r)throw 0;id=r.id}
    for(const file of files)await add('dayPhotos',{dayId:id,img:await resize(file)});
    $('dForm').classList.add('hide');$('dErr').textContent='';
  }catch(e){$('dErr').textContent='Couldn’t save everything — please try again.'}
  $('dSave').disabled=false};
$('dNew').onclick=()=>openDay();$('dCancel').onclick=()=>$('dForm').classList.add('hide');
$('dSearch').oninput=e=>{D.q=e.target.value;renderDays()};$('dTag').oninput=e=>{D.tag=e.target.value;renderDays()};
$('dFrom').onchange=e=>{D.from=e.target.value;renderDays()};$('dTo').onchange=e=>{D.to=e.target.value;renderDays()};
$('dFavF').onclick=()=>{D.fav=!D.fav;renderDays()};$('dView').onclick=()=>{D.cal=!D.cal;if(!D.cal)D.day='';renderDays()};
$('dPrev').onclick=()=>{D.m=new Date(D.m.getFullYear(),D.m.getMonth()-1,1);renderDCal()};$('dNext').onclick=()=>{D.m=new Date(D.m.getFullYear(),D.m.getMonth()+1,1);renderDCal()};
Object.assign(renderers,{links:renderLinks,linkCategories:renderLinks,days:renderDays,dayPhotos:()=>{renderDays();renderForm()},emotions:renderForm});

function watch(coll,lim){
  unsubs.push(onSnapshot(query(collection(fs,coll),orderBy('ts','desc'),limit(lim)),snap=>{
    data[coll]=snap.docs.map(x=>({id:x.id,...x.data()}));loaded[coll]=1;renderers[coll]&&renderers[coll]();
  },()=>{loaded[coll]='err';$('sub').textContent='couldn’t load some data 🥺 (check the Firestore rules)';renderers[coll]&&renderers[coll]()}));
}
async function add(coll,obj){
  try{return await addDoc(collection(fs,coll),{...obj,uid:me,name:nick,ts:Date.now()})}
  catch(e){alert('Couldn’t save that. Try again?');return false}
}
function resize(file,max=900,q=0.72){
  return new Promise((ok,bad)=>{const im=new Image(),u=URL.createObjectURL(file);
    im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',q))};
    im.onerror=bad;im.src=u});
}

$('moods').append(...MOODS.map(m=>{const b=el('button',m===mood?'on':'',m);b.onclick=()=>{mood=m;[...$('moods').children].forEach(x=>x.classList.toggle('on',x===b))};return b}));
$('postBtn').onclick=async()=>{const t=$('postText').value.trim();if(!t)return;if(await add('posts',{text:t,mood}))$('postText').value=''};
$('planBtn').onclick=async()=>{const t=$('planText').value.trim();if(!t)return;if(await add('plans',{text:t,date:selDate}))$('planText').value=''};
$('songBtn').onclick=async()=>{const t=$('songTitle').value.trim();if(!t)return;const u=$('songUrl').value.trim();if(u&&!safeUrl(u)){alert('That link looks off.');return}
  if(await add('songs',{title:t,url:u?safeUrl(u):''})){$('songTitle').value='';$('songUrl').value=''}};


$('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);renderCal()};
$('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);renderCal()};
$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  [...$('tabs').children].forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='p-'+b.dataset.t))};
$('loginBtn').onclick=async()=>{$('loginErr').textContent='';
  try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('pass').value)}
  catch(e){$('loginErr').textContent='wrong email or password 🥺'}};
$('logout').onclick=()=>signOut(auth);

Object.values(renderers).forEach(f=>f());
onAuthStateChanged(auth,u=>{
  unsubs.forEach(f=>f());unsubs=[];
  const on=!!u;me=u?u.uid:null;
  $('login').classList.toggle('hide',on);$('app').classList.toggle('hide',!on);$('tabs').classList.toggle('hide',!on);
  if(!on){$('sub').textContent='just for the two of us ♡';return}
  if(!nick){nick=(prompt('What should we call you? (shown on your posts)')||'').trim().slice(0,20)||u.email.split('@')[0];localStorage.setItem('nick',nick)}
  $('sub').textContent='hi '+nick+' ♡';
  watch('posts',60);watch('plans',500);watch('songs',200);watch('photos',60);watch('links',500);watch('linkCategories',100);watch('days',500);watch('dayPhotos',400);watch('emotions',100);
});
</script>
